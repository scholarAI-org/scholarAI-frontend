openapi: 3.0.3
info:
  title: Student notifications (BE-13), as consumed by the frontend
  description: >
    Proposal-level contract used by the frontend adapter and implemented by the e2e
    fake backend. The real endpoints do not exist yet. The existing admin endpoints
    (/admin/notifications...) are a different, admin-only API and are never called.
  version: 0.1.0-proposal
paths:
  /api/notifications:
    get:
      summary: Notifications of the authenticated student, newest first
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: is_read,
            in: query,
            required: false,
            schema: { type: boolean },
            description: Not sent by the frontend (filters are out of scope),
          }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationListResponse' }
        '401': { description: Missing or invalid authentication }
        '403': { description: Account disabled }
  /api/notifications/unread-count:
    get:
      summary: Unread count for the authenticated student
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCountResponse' }
              example: { unread_count: 3 }
        '401': { description: Missing or invalid authentication }
        '403': { description: Account disabled }
  /api/notifications/{id}/read:
    patch:
      summary: Mark one notification as read (idempotent)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarkReadResponse' }
        '401': { description: Missing or invalid authentication }
        '404': { description: Unknown id, or not the student's notification }
  /api/notifications/read-all:
    patch:
      summary: Mark every notification of the student as read
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadAllResponse' }
              example: { updated: 5 }
        '401': { description: Missing or invalid authentication }
components:
  schemas:
    NotificationListResponse:
      type: object
      required: [items, total, page, page_size, total_pages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NotificationItem' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total_pages: { type: integer, minimum: 0 }
    NotificationItem:
      type: object
      required: [id, type, params, created_at, is_read, action]
      properties:
        id: { type: integer }
        type:
          type: string
          description: The frontend knows the six values below; any other value is skipped.
          x-known-values:
            [
              deadline_reminder,
              scholarship_match,
              saved_scholarship_updated,
              scholarship_archived,
              profile_incomplete,
              document_analysis_ready,
            ]
        params: { type: object, description: Shape depends on type, see contract-notes.md }
        created_at: { type: string, format: date-time, description: UTC, with Z }
        is_read: { type: boolean }
        action:
          nullable: true
          type: object
          required: [type, target_id]
          properties:
            type: { type: string }
            target_id: { type: integer, nullable: true }
    UnreadCountResponse:
      type: object
      required: [unread_count]
      properties:
        unread_count: { type: integer, minimum: 0 }
    MarkReadResponse:
      type: object
      required: [id, is_read, read_at]
      properties:
        id: { type: integer }
        is_read: { type: boolean }
        read_at: { type: string, format: date-time }
    ReadAllResponse:
      type: object
      required: [updated]
      properties:
        updated: { type: integer, minimum: 0 }
